<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VNPT Invoices Add-in</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<style>
  body{display:flex;align-items:center;justify-content:center;padding:24px;min-height:100dvh}
  .card{max-width:440px;width:100%;padding:36px 32px 32px}
  a.btn.primary{width:100%;margin-top:22px}
  a.btn.sec{width:100%;margin-top:10px}
  footer{margin-top:28px;text-align:center;color:var(--muted);font-size:11px;
    text-transform:uppercase;letter-spacing:.08em}
  .head-block{margin-bottom:18px}
  .ver-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 22px}
  .ver-row .pill-badge{margin:0}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(22,22,26,.45);display:none;
    align-items:center;justify-content:center;padding:24px;z-index:100;
  }
  .modal-overlay.open{display:flex}
  .modal-card{
    background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow-card);
    max-width:480px;width:100%;max-height:min(640px,80vh);padding:24px;
    display:flex;flex-direction:column;gap:14px;
  }
  .modal-head{display:flex;align-items:center;justify-content:space-between;flex:none}
  .modal-head h2{font-size:18px;font-weight:800;margin:0}
  .modal-body{overflow-y:auto;font-size:13px;line-height:1.6;color:var(--text)}
  .modal-body h3{font-size:13px;font-weight:700;margin:16px 0 4px;color:var(--accent-ink)}
  .modal-body h3:first-child{margin-top:0}
  .modal-body p{margin:0 0 4px;color:var(--text)}
  .modal-body blockquote{
    margin:0 0 12px;padding:10px 12px;background:var(--card-alt);border-radius:var(--r-sm);
    color:var(--muted);font-size:12px;
  }
  .modal-body code{font-size:11.5px}
</style>
</head>
<body>
  <div class="card">
    <div class="head-block reveal">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/></svg>
      </div>
      <h1 style="margin-top:16px">VNPT Invoices Add-in</h1>
      <p class="sub">Excel add-in tạo &amp; phát hành hóa đơn điện tử VNPT Invoice</p>
    </div>
    <div class="ver-row reveal">
      <div class="pill-badge ok" id="verPill"><span id="verText">Đang tải phiên bản…</span></div>
      <button class="link" id="changelogBtn" type="button">Changelog</button>
    </div>

    <a class="btn primary reveal" id="setupLink" href="VNPT.Invoices.AddInV2-Setup.exe" download="VNPT.Invoices.AddInV2-Setup.exe">
      <svg data-icon viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Tải bộ cài
    </a>

    <label class="sub-label" style="margin-top:22px">Công cụ</label>
    <div class="tool-grid reveal">
      <a class="tool-tile" href="profile-json-generator/">
        <div class="ti"><svg data-icon viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg></div>
        <div class="tt">Tạo JSON cấu hình kết nối</div>
      </a>
      <a class="tool-tile" href="https://vnpt-invoice-addin.gitbook.io/vnpt-invoice-addin-v2" target="_blank" rel="noopener">
        <div class="ti"><svg data-icon viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></div>
        <div class="tt">Hướng dẫn sử dụng</div>
      </a>
    </div>

    <footer>TTKDGP — Phòng Giải pháp số</footer>
  </div>

  <div class="modal-overlay" id="changelogOverlay">
    <div class="modal-card">
      <div class="modal-head">
        <h2>Changelog</h2>
        <button class="icon" id="changelogClose" type="button" aria-label="Đóng">
          <svg data-icon viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body" id="changelogBody">Đang tải…</div>
    </div>
  </div>

<script>
  fetch('update.json?t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){
      document.getElementById('verText').textContent = 'Phiên bản ' + d.latestVersion;
      document.getElementById('setupLink').download = 'VNPT.Invoices.AddInV2-v' + d.latestVersion + '-Setup.exe';
    })
    .catch(function(){ document.getElementById('verPill').style.display = 'none'; });

  function escHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function inlineMd(s){
    return escHtml(s)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/`(.+?)`/g, '<code>$1</code>');
  }
  function changelogToHtml(md){
    return md.split(/\n\n+/).map(function(block){
      block = block.trim();
      if (!block || block.indexOf('# Changelog') === 0) return '';
      if (block.indexOf('## ') === 0) return '<h3>' + inlineMd(block.slice(3)) + '</h3>';
      if (block.indexOf('> ') === 0) {
        var text = block.split('\n').map(function(l){ return l.replace(/^>\s?/, ''); }).join(' ');
        return '<blockquote>' + inlineMd(text) + '</blockquote>';
      }
      return '<p>' + inlineMd(block.split('\n').join(' ')) + '</p>';
    }).join('');
  }

  var changelogOverlay = document.getElementById('changelogOverlay');
  var changelogBody = document.getElementById('changelogBody');
  var changelogLoaded = false;
  function openChangelog(){
    changelogOverlay.classList.add('open');
    if (changelogLoaded) return;
    fetch('CHANGELOG.md?t=' + Date.now())
      .then(function(r){ return r.text(); })
      .then(function(md){ changelogBody.innerHTML = changelogToHtml(md); changelogLoaded = true; })
      .catch(function(){ changelogBody.textContent = 'Không tải được changelog.'; });
  }
  document.getElementById('changelogBtn').addEventListener('click', openChangelog);
  document.getElementById('changelogClose').addEventListener('click', function(){
    changelogOverlay.classList.remove('open');
  });
  changelogOverlay.addEventListener('click', function(e){
    if (e.target === changelogOverlay) changelogOverlay.classList.remove('open');
  });

  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){ if (e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
  }, { threshold: .2 });
  document.querySelectorAll('.reveal').forEach(function(el, i){
    el.style.transitionDelay = (i * 60) + 'ms';
    io.observe(el);
  });
</script>
</body>
</html>
