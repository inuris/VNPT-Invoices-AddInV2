<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VNPT Invoices Add-in</title>
<link rel="stylesheet" href="assets/theme.css">
<style>
  body{display:flex;align-items:center;justify-content:center;padding:24px;min-height:100vh}
  .card{max-width:420px;width:100%;padding:36px 32px 30px}
  .btns{display:flex;flex-direction:column;gap:10px;margin-top:4px}
  .btns a.btn{width:100%}
  footer{margin-top:22px;text-align:center;color:var(--muted);font-size:11px}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/></svg>
    </div>
    <h1 style="margin-top:16px">VNPT Invoices Add-in</h1>
    <p class="sub">Excel add-in tạo &amp; phát hành chứng từ điện tử VNPT Invoice</p>
    <div class="pill-badge ok" id="verPill" style="margin:14px 0 22px"><span id="verText">Đang tải phiên bản…</span></div>

    <div class="btns">
      <a class="btn primary" href="VNPT.Invoices.AddInV2-Setup.exe">
        <svg data-icon viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Tải bộ cài
      </a>
      <a class="btn sec" href="profile-json-generator/">
        <svg data-icon viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
        Tạo JSON cấu hình kết nối
      </a>
      <a class="btn sec" href="https://vnpt-invoice-addin.gitbook.io/vnpt-invoice-addin-v2" target="_blank" rel="noopener">
        <svg data-icon viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        Hướng dẫn sử dụng
      </a>
    </div>

    <footer>TTKDGP — Phòng Giải pháp số</footer>
  </div>

<script>
  fetch('update.json?t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){ document.getElementById('verText').textContent = 'Phiên bản ' + d.latestVersion; })
    .catch(function(){ document.getElementById('verPill').style.display = 'none'; });
</script>
</body>
</html>
