<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>VNPT Invoice — Yêu cầu License</title>
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/theme.css">
<style>
  .wrap{max-width:560px;margin:0 auto;padding:28px 18px 60px}
  header.site{margin-bottom:20px}
  .grid-two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:480px){.grid-two{grid-template-columns:1fr}}
  .field{margin-bottom:14px}
  #doneCard{display:none}
</style>
</head>
<body>
<div class="wrap">
  <a class="crumb" href="../">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    VNPT Invoices Add-in
  </a>
  <header class="site reveal">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <div>
      <h1>Yêu cầu License</h1>
      <p class="sub">Dành cho đội AM — license được gửi về đúng email nội bộ vừa nhập</p>
    </div>
  </header>

  <div class="card reveal" id="formCard">
    <form id="licForm">
      <div class="field">
        <label>Email nội bộ <span class="req">*</span></label>
        <input type="email" id="f-email" placeholder="ten.nv@vnpt.vn" required>
      </div>
      <div class="field">
        <label>Passcode <span class="req">*</span></label>
        <input type="password" id="f-passcode" placeholder="Passcode được cấp" required>
      </div>
      <div class="field">
        <label>MST khách hàng <span class="req">*</span></label>
        <input type="text" id="f-mst" placeholder="VD: 0315890356" required>
      </div>
      <div class="field">
        <label>Thời hạn</label>
        <select id="f-validrange">
          <option value="">Vĩnh viễn</option>
          <option value="1">1 tháng</option>
          <option value="3">3 tháng</option>
          <option value="6">6 tháng</option>
          <option value="12">12 tháng</option>
          <option value="24">24 tháng</option>
        </select>
      </div>
      <div class="field">
        <label>Ghi chú <span class="opt">(tùy chọn)</span></label>
        <input type="text" id="f-note" placeholder="VD: tên khách hàng, mục đích...">
      </div>
      <button class="primary" type="submit" id="submitBtn" style="width:100%">Gửi yêu cầu</button>
      <div id="err" class="msg err" style="margin-top:8px"></div>
    </form>
  </div>

  <div class="card reveal" id="doneCard">
    <p class="hint" style="margin:0;font-size:13px;color:var(--text)">
      Đã gửi yêu cầu. License sẽ được gửi qua email nội bộ vừa nhập trong ít phút.<br>
      Không thấy license sau 5 phút — kiểm tra lại Email/Passcode rồi gửi lại, hoặc báo admin.
    </p>
    <button class="sec" type="button" id="againBtn" style="margin-top:14px">Gửi yêu cầu khác</button>
  </div>
</div>

<script>
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwDHmN1vKCpeNONsvULQ6-jUhA5YZvZeMoVZUYY_KSIDpKz-R3jzzkIoyIvogPzXe8G/exec';

const form = document.getElementById('licForm');
const submitBtn = document.getElementById('submitBtn');
const err = document.getElementById('err');

form.addEventListener('submit', async e => {
  e.preventDefault();
  err.textContent = '';
  submitBtn.disabled = true;
  submitBtn.textContent = 'Đang gửi...';

  const body = new URLSearchParams({
    Email: document.getElementById('f-email').value.trim(),
    Passcode: document.getElementById('f-passcode').value.trim(),
    TaxCode: document.getElementById('f-mst').value.trim(),
    ValidRange: document.getElementById('f-validrange').value,
    Note: document.getElementById('f-note').value.trim()
  });

  try {
    // no-cors: không đọc được response, nhưng request vẫn tới doPost bình thường.
    await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body });
    document.getElementById('formCard').style.display = 'none';
    document.getElementById('doneCard').style.display = 'block';
  } catch (ex) {
    err.textContent = 'Gửi thất bại, kiểm tra kết nối mạng và thử lại.';
    submitBtn.disabled = false;
    submitBtn.textContent = 'Gửi yêu cầu';
  }
});

document.getElementById('againBtn').addEventListener('click', () => {
  form.reset();
  submitBtn.disabled = false;
  submitBtn.textContent = 'Gửi yêu cầu';
  document.getElementById('doneCard').style.display = 'none';
  document.getElementById('formCard').style.display = 'block';
});

const io = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
}, { threshold: .15 });
document.querySelectorAll('.reveal').forEach((el, i) => {
  el.style.transitionDelay = (i * 60) + 'ms';
  io.observe(el);
});
</script>
</body>
</html>
