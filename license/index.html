<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>VNPT Invoice — License Generator</title>
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/theme.css">
<style>
  .wrap{max-width:1200px;margin:0 auto;padding:24px 20px 60px}
  header.site{margin-bottom:20px}
  .cols{display:grid;grid-template-columns:3fr 7fr;gap:18px}
  @media(max-width:860px){.wrap{padding:16px 14px 48px}.cols{grid-template-columns:1fr}}
  .field{margin-bottom:14px}
  .grid-two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:480px){.grid-two{grid-template-columns:1fr}}

  .auth-card{margin-bottom:18px}
  .auth-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:600px){.auth-row{grid-template-columns:1fr}}

  .list-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
  .filter-short{width:140px;flex:none}
  #fetchBtn.loading svg{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){ #fetchBtn.loading svg{animation:none} }
  .list-empty{color:var(--muted);font-size:13px;text-align:center;padding:24px 0}

  table.lic-table{width:100%;border-collapse:collapse;font-size:12.5px}
  table.lic-table th{text-align:left;color:var(--muted);font-weight:700;font-size:11px;
    text-transform:uppercase;letter-spacing:.08em;padding:0 8px 8px;border-bottom:1px solid var(--line)}
  table.lic-table td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  table.lic-table tr:last-child td{border-bottom:0}
  .lic-trunc{display:inline-block;max-width:150px;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;vertical-align:middle;font-family:Consolas,Menlo,monospace;font-size:11px}
  .copy-btn{padding:0;width:28px;height:28px;min-height:28px;border-radius:999px;margin-left:4px}
  .copy-btn svg{width:13px;height:13px}
  .pager{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px}
  .pager span{color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <a class="crumb" href="../">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    VNPT Invoices Add-in
  </a>
  <header class="site reveal">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <div>
      <h1>License Generator</h1>
    </div>
  </header>

  <div class="card auth-card reveal">
    <div class="auth-row">
      <div class="field" style="margin-bottom:0">
        <label>Email <span class="req">*</span></label>
        <input type="email" id="auth-email" placeholder="ten.nv@vnpt.vn">
      </div>
      <div class="field" style="margin-bottom:0">
        <label>Passcode <span class="req">*</span></label>
        <input type="password" id="auth-passcode" placeholder="passcode">
      </div>
    </div>
  </div>

  <div class="cols">
    <div class="left">
      <div class="card reveal">
        <div class="list-toolbar">
          <h3 style="margin:0;font-size:14px;flex:none">Tạo license</h3>
        </div>
        <form id="licForm">
          <div class="field">
            <label>MST khách hàng <span class="req">*</span></label>
            <input type="text" id="f-mst" placeholder="VD: 0315890356" required>
          </div>
          <div class="field">
            <label>Thời hạn</label>
            <select id="f-validrange">
              <option value="">Vĩnh viễn</option>
              <option value="1">1 tháng</option>
              <option value="3">3 tháng</option>
              <option value="6">6 tháng</option>
              <option value="12">12 tháng</option>
              <option value="24">24 tháng</option>
            </select>
          </div>
          <div class="field">
            <label>Ghi chú <span class="opt">(không bắt buộc)</span></label>
            <input type="text" id="f-note" placeholder="Ghi chú thêm, nhập tùy ý">
          </div>
          <button class="primary" type="submit" id="submitBtn" style="width:100%">Gửi yêu cầu</button>
          <div id="err" class="msg"></div>
        </form>
      </div>
    </div>

    <div>
      <div class="card reveal">
        <div class="list-toolbar">
          <h3 style="margin:0;font-size:14px;flex:none">Danh sách yêu cầu</h3>
          <button class="primary icon" id="fetchBtn" title="Tải" aria-label="Tải">
            <svg data-icon viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          </button>
          <span class="spacer" style="flex:1"></span>
          <input type="text" id="f-filter" placeholder="Lọc MST..." class="filter-short">
        </div>
        <div id="listArea"></div>
      </div>
    </div>
  </div>
</div>

<script>
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwDHmN1vKCpeNONsvULQ6-jUhA5YZvZeMoVZUYY_KSIDpKz-R3jzzkIoyIvogPzXe8G/exec';
const PAGE_SIZE = 20;

// ---- Đăng nhập chung, nhớ qua localStorage ----
const authEmail = document.getElementById('auth-email');
const authPasscode = document.getElementById('auth-passcode');
authEmail.value = localStorage.getItem('lic_email') || '';
authPasscode.value = localStorage.getItem('lic_passcode') || '';
authEmail.addEventListener('input', () => localStorage.setItem('lic_email', authEmail.value.trim()));
authPasscode.addEventListener('input', () => localStorage.setItem('lic_passcode', authPasscode.value.trim()));

// ---- Gửi yêu cầu (cột trái) ----
const form = document.getElementById('licForm');
const submitBtn = document.getElementById('submitBtn');
const err = document.getElementById('err');

form.addEventListener('submit', async e => {
  e.preventDefault();
  err.className = 'msg';
  err.textContent = '';

  const email = authEmail.value.trim();
  const passcode = authPasscode.value.trim();
  if (!email || !passcode) {
    err.className = 'msg err';
    err.textContent = 'Nhập Email và Passcode ở trên trước.';
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = 'Đang gửi...';

  const body = new URLSearchParams({
    Email: email,
    Passcode: passcode,
    TaxCode: document.getElementById('f-mst').value.trim(),
    ValidRange: document.getElementById('f-validrange').value,
    Note: document.getElementById('f-note').value.trim()
  });

  try {
    // no-cors: không đọc được response, nhưng request vẫn tới doPost bình thường.
    await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body });
    err.className = 'msg ok';
    err.textContent = 'Đã nhận yêu cầu, bấm Tải lại sau vài phút để nhận license.';
    document.getElementById('f-mst').value = '';
    document.getElementById('f-note').value = '';
  } catch (ex) {
    err.className = 'msg err';
    err.textContent = 'Gửi thất bại, kiểm tra kết nối mạng và thử lại.';
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Gửi yêu cầu';
  }
});

// ---- Danh sách yêu cầu (cột phải) ----
let allRecords = [];
let currentPage = 1;

const listArea = document.getElementById('listArea');
const filterInput = document.getElementById('f-filter');
const fetchBtn = document.getElementById('fetchBtn');

fetchBtn.addEventListener('click', loadRecords);
filterInput.addEventListener('input', () => { currentPage = 1; renderList(); });

async function loadRecords(){
  const email = authEmail.value.trim();
  const passcode = authPasscode.value.trim();
  if (!email || !passcode) {
    listArea.innerHTML = '<div class="list-empty">Nhập Email và Passcode ở trên trước.</div>';
    return;
  }
  fetchBtn.disabled = true;
  fetchBtn.classList.add('loading');
  try {
    const url = WEB_APP_URL + '?email=' + encodeURIComponent(email) + '&passcode=' + encodeURIComponent(passcode);
    const res = await fetch(url);
    const json = await res.json();
    if (json.status !== 'success') {
      listArea.innerHTML = '<div class="list-empty">' + (json.message || 'Lỗi không rõ') + '</div>';
      allRecords = [];
      return;
    }
    allRecords = json.data || [];
    currentPage = 1;
    renderList();
  } catch (ex) {
    listArea.innerHTML = '<div class="list-empty">Không tải được danh sách — kiểm tra lại Email/Passcode hoặc thử lại.</div>';
  } finally {
    fetchBtn.disabled = false;
    fetchBtn.classList.remove('loading');
  }
}

function renderList(){
  const q = filterInput.value.trim().toLowerCase();
  const filtered = q ? allRecords.filter(r => String(r.mst || '').toLowerCase().includes(q)) : allRecords;

  if (filtered.length === 0) {
    listArea.innerHTML = '<div class="list-empty">Chưa có dữ liệu. Bấm Tải để tải.</div>';
    return;
  }

  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  if (currentPage > totalPages) currentPage = totalPages;
  const start = (currentPage - 1) * PAGE_SIZE;
  const pageRows = filtered.slice(start, start + PAGE_SIZE);

  let html = '<table class="lic-table"><thead><tr>' +
    '<th>Ngày yêu cầu</th><th>MST</th><th>License</th><th>Thời hạn</th><th>Ghi chú</th>' +
    '</tr></thead><tbody>';

  pageRows.forEach((r, i) => {
    const lic = String(r.license || '');
    html += '<tr>' +
      '<td>' + esc_(r.date) + '</td>' +
      '<td>' + esc_(r.mst) + '</td>' +
      '<td><span class="lic-trunc" title="' + esc_(lic) + '">' + esc_(lic) + '</span>' +
      '<button class="mini icon copy-btn" type="button" data-idx="' + (start + i) + '" title="Sao chép">' +
      '<svg data-icon viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>' +
      '</button></td>' +
      '<td>' + esc_(r.exp || 'Vĩnh viễn') + '</td>' +
      '<td>' + esc_(r.note) + '</td>' +
      '</tr>';
  });
  html += '</tbody></table>';

  html += '<div class="pager">' +
    '<button class="mini sec" type="button" id="prevPage"' + (currentPage <= 1 ? ' disabled' : '') + '>Trước</button>' +
    '<span>Trang ' + currentPage + '/' + totalPages + '</span>' +
    '<button class="mini sec" type="button" id="nextPage"' + (currentPage >= totalPages ? ' disabled' : '') + '>Sau</button>' +
    '</div>';

  listArea.innerHTML = html;

  const prevBtn = document.getElementById('prevPage');
  const nextBtn = document.getElementById('nextPage');
  if (prevBtn) prevBtn.addEventListener('click', () => { currentPage--; renderList(); });
  if (nextBtn) nextBtn.addEventListener('click', () => { currentPage++; renderList(); });

  listArea.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const rec = filtered[Number(btn.dataset.idx)];
      if (!rec) return;
      navigator.clipboard.writeText(String(rec.license || ''));
      const original = btn.innerHTML;
      btn.innerHTML = '✓';
      setTimeout(() => { btn.innerHTML = original; }, 1200);
    });
  });
}

function esc_(s){
  return (s == null ? '' : String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
}

listArea.innerHTML = '<div class="list-empty">Bấm Tải để tải danh sách yêu cầu của bạn.</div>';

const io = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
}, { threshold: .15 });
document.querySelectorAll('.reveal').forEach((el, i) => {
  el.style.transitionDelay = (i * 60) + 'ms';
  io.observe(el);
});
</script>
</body>
</html>
